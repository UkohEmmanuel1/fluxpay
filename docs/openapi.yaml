openapi: 3.1.0
info:
  title: FluxPay API (prototype)
  version: 0.3.0
  description: Prototype API. Not production-ready; payment confirmations are simulated and no chain watcher is wired.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness
      responses:
        "200": { description: Healthy }
  /ready:
    get:
      security: []
      summary: Database readiness
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /v1/payments:
    post:
      summary: Create payment intent (prototype)
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount: { type: string, example: "25.00" }
                currency: { type: string, example: USDC }
                network: { type: string, example: base-sepolia }
                reference: { type: string }
                expires_in: { type: integer, minimum: 60, maximum: 86400 }
      responses:
        "201": { description: Payment created }
        "400": { description: Invalid request }
    get:
      summary: List latest payments (first 100)
      responses:
        "200": { description: Payment list }
  /v1/payments/{id}:
    get:
      summary: Retrieve a payment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Payment }
        "404": { description: Not found }
  /v1/payments/{id}/dev-confirm:
    post:
      summary: Simulate confirmation (development only)
      description: Not a real blockchain verification. Must remain disabled for production.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_hash]
              properties:
                transaction_hash: { type: string }
      responses:
        "200": { description: Simulated confirmation }
        "404": { description: Disabled }
  /v1/invoices:
    post:
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: string }
                currency: { type: string, default: USD }
                description: { type: string }
                customer_email: { type: string, format: email }
                reference: { type: string }
                expires_in: { type: integer }
      responses:
        "201": { description: Invoice created }
    get:
      summary: List latest invoices
      responses:
        "200": { description: Invoice list }
  /v1/invoices/{id}:
    get:
      summary: Retrieve invoice
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Invoice }
        "404": { description: Not found }
  /v1/payment-links:
    post:
      summary: Create payment link record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: string, nullable: true }
                currency: { type: string, default: USD }
                title: { type: string }
                description: { type: string }
                reference: { type: string }
                expires_in: { type: integer }
      responses:
        "201": { description: Payment link record created }
    get:
      summary: List payment links
      responses:
        "200": { description: Payment link list }
  /v1/customers:
    post:
      summary: Create customer record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                name: { type: string }
                metadata: { type: object }
      responses:
        "201": { description: Customer created }
    get:
      summary: List customer records
      responses:
        "200": { description: Customer list }
  /v1/webhook-endpoints:
    post:
      summary: Register webhook endpoint (stored; not connected to delivery worker)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                events: { type: array, items: { type: string } }
      responses:
        "201": { description: Endpoint registered }
    get:
      summary: List webhook endpoint registrations
      responses:
        "200": { description: Endpoint list }
  /v1/analytics/overview:
    get:
      summary: Basic payment count analytics
      responses:
        "200": { description: Counts and confirmation ratio }
  /checkout/{id}:
    get:
      security: []
      summary: Basic invoice HTML checkout display
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: HTML invoice page }
        "404": { description: Not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
